<script>

const TELEGRAM_LINK =
"https://t.me/+zm-nDu_ZD48zYmU1";

/* PURPLE RAIN */

const rain = document.getElementById("rain");

const total =
window.innerWidth < 600 ? 35 : 60;

for(let i=0;i<total;i++){

const drop=document.createElement("div");

drop.className="drop";

drop.style.left =
(Math.random()*100)+"%";

drop.style.height =
(30+Math.random()*55)+"px";

drop.style.animationDuration =
(3+Math.random()*5)+"s";

drop.style.animationDelay =
(-Math.random()*8)+"s";

rain.appendChild(drop);

}


/* SUBSCRIBE EVENT */

let subscribeSent=false;

function sendSubscribe(){

if(subscribeSent) return;

subscribeSent=true;

if(typeof fbq==="function"){

fbq(
"track",
"Subscribe",
{
content_name:"Jackpot King Guru Telegram",
content_category:"Telegram Channel"
}
);

}

}


/* JOIN BUTTON */

document
.getElementById("joinButton")
.addEventListener("click",function(){

sendSubscribe();

setTimeout(function(){

window.location.href=TELEGRAM_LINK;

},300);

});


/* 10 SECOND AUTO REDIRECT */

let count=10;

const seconds=
document.getElementById("seconds");

const countdown=
setInterval(function(){

count--;

seconds.textContent=count;

if(count<=0){

clearInterval(countdown);

window.location.href=TELEGRAM_LINK;

}

},1000);

</script>
